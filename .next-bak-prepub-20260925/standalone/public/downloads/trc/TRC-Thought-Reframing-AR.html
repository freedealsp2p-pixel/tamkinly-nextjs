## محتوى الصفحات 
 
### الصفحة 1 
- **عنوان رئيسي**: "التعافي من العار" 
- **غرض**: "تمييز العار عن الذنب وتطوير التعاطف مع الذات كأداة للتعافي من العار المترسب بالصدمة." 
- **تنبيه السلامة** (خلفية #FEF3C7، حدود #B45309، لون #78350F): 
  "عمل العار يتطلب موارد أمان مسبقًا. إذا كان العار يخبرك أنك لا تستحق المساعدة — هذا العار يكذب. اطلب الدعم." 
- **العار مقابل الذنب**: 
  - العار = "أنا سيء" (مستوى الهوية، شامل، استجابة إخفاء) 
  - الذنب = "فعلت شيئًا سيئًا" (مستوى السلوك، محدد، استجابة إصلاح) 
  - جدول مقارنة 
  - حقل: "أيّهما أختبر الآن؟" — فارغ 
 
### الصفحة 2 
- **تحديد محفز العار** — حقول كتابة فارغة: 
  - "ما الذي أثار شعور العار؟" 
  - "ما القصة التي يخبرني إياها العار عن نفسي؟" 
  - "أين في جسدي أشعر بالعار؟" 
  - "ما أقدم ذكرى لرسالة العار هذه؟" 
- **استجابة الجسد للعار**: 
  - حقل: "ماذا يريد جسدي أن يفعل؟ (إخفاء، تقلص، اختفاء، إرضاء)" — فارغ 
  - حقل: "ماذا يقول صوت العار؟" — فارغ 
 
### الصفحة 3 
- **تمرين التعاطف مع الذات** (3 خطوات): 
  - الخطوة 1: **إقرار المعاناة** — "هذه لحظة معاناة" — حقل للنسخة الشخصية فارغ 
  - الخطوة 2: **التطبيع** — "العار تجربة بشرية. لست وحدك" — حقل فارغ 
  - الخطوة 3: **لطف الذات** — "ماذا أقول لصديق عزيز؟" — حقل فارغ 
- **التحدث عن العار**: 
  - حقل: "من الشخص الآمن الذي يمكنني مشاركة هذا معه؟" — فارغ 
  - حقل: "ماذا أريد أن يعرف؟" — فارغ 
 
### الصفحة 4 
- **التكامل** — حقول كتابة فارغة: 
  - "ما الشيء الذي يمكنني فعله بشكل مختلف المرة القادمة التي يتحدث فيها العار؟" 
  - "ما الحقيقة التي يقدمها لي التعاطف مع الذات؟" 
  - "ماذا أختار أن أترك؟" 
- **متى تتوقف** (تنبيه #FFFBEB / #D97706): 
  - "إذا زاد العار عمقًا" 
  - "إذا شعرت أن التعاطف مع الذات مستحيل" 
  - "إذا ظهرت رغبات إيذاء النفس" 
- **جهات اتصال الطوارئ** — 3 حقول كتابة فارغة 
- **تذييل**: علامة Tamkinly التجارية | Tool ID: TRC-SHAME_RECOVERY | رقم الصفحة
