<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Circular Frame - Thin stroke -->
  <circle cx="100" cy="85" r="65" fill="none" stroke="#0F1C2E" stroke-width="2"/>
  
  <!-- T Letter - Bold Serif Style -->
  <g fill="#0F1C2E">
    <!-- T horizontal bar (serif top) -->
    <rect x="55" y="45" width="90" height="18" rx="1"/>
    <!-- T vertical stem -->
    <rect x="88" y="45" width="24" height="60" rx="1"/>
    <!-- Bottom serif feet -->
    <rect x="80" y="100" width="40" height="6" rx="1"/>
  </g>
  
  <!-- Stylized L Letter - Shaped like a leaf/swoosh, curving upward -->
  <path 
    d="M108 55 
       Q135 62 142 85 
       Q150 110 140 125 
       Q128 138 115 130
       Q105 120 108 100
       Q110 75 108 55 Z" 
    fill="#3DD4B0" />
  
  <!-- L inner curve vein detail -->
  <path 
    d="M118 70 Q130 90 128 110 Q126 120 120 125" 
    fill="none" 
    stroke="#1F6F78" 
    stroke-width="1.5" 
    stroke-linecap="round"
    opacity="0.4"/>
  
  <!-- Brand Name - TAMKINLY -->
  <text x="100" y="185" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="24" 
        font-weight="bold"
        letter-spacing="3"
        text-anchor="middle" 
        fill="#0F1C2E">TAMKINLY</text>
</svg>
