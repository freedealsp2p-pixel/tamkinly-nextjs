name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

# AUD-1 (2026-11-08): serialize deploys — 3 pushes in 10s raced 3 deploys on the
# same VPS working tree (git pull 'no candidates' + pm2 left stopped -> 502).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 40m
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}

            # ---- WORKING-TREE GUARD (2026-10-17, AUD-1; extended 2026-10-21) ----
            # Deploys were blocked: VPS tree had uncommitted local edits of
            # src/app/methodology/self-authorship/page.tsx (run 39070733976) and
            # src/components/layout/Footer.tsx (blocked runs 183-186 with a stuck
            # merge conflict). Stash - never discard - those files (explicit
            # identity: server may lack git user config); anything else dirty
            # still fails loudly. Stashes remain recoverable on the VPS.
            git -c user.email=autodeploy@tamkinly.local -c user.name=tamkinly-autodeploy \
              stash push -m "autodeploy guard $(date -u +%FT%TZ)" \
              -- src/app/methodology/self-authorship/page.tsx src/components/layout/Footer.tsx || true

            # Pull latest changes
            git pull origin master

            # Install dependencies
            npm install

            # Generate Prisma client
            npx prisma generate

            # ---- DATABASE SAFETY (2026-09-06, amended 2026-10-17 by AUD-1) ----
            # Design: no SILENT data loss. A full file-level SQLite backup is taken
            # before every push (last 5 kept on the VPS), then --accept-data-loss is
            # permitted: destructive schema changes (e.g. dropping the stale
            # 'agent_events' table, 11 rows) proceed ONLY after an on-server snapshot
            # exists -> every change stays reversible, nothing is lost silently.
            mkdir -p db/backups
            if [ -f db/custom.db ]; then
              cp db/custom.db "db/backups/custom-$(date -u +%Y%m%dT%H%M%SZ).db"
              ls -1t db/backups/custom-*.db 2>/dev/null | tail -n +6 | xargs -r rm -f || true
              echo "DB backup taken: db/backups/custom-$(date -u +%Y%m%dT%H%M%SZ).db"
            fi
            npx prisma db push --skip-generate --accept-data-loss

            # ---- TASK70 products sync (AUD-1, 2026-10-25) ----
            # Guarded, idempotent sync of the stale products cache to V2
            # (one-time Planner $9.99 / Mastery $27) + AR enrichment + retirement
            # of the two legacy monthly rows syncToDatabase never touches.
            # DB backup above already covers this. Non-fatal by design.
            node prisma/seed-task70-products.mjs || echo "[TASK70-DB] products sync failed (non-fatal, deploy continues)"

            # Remove stale Next build lock (only when no build is actually running)
            if [ -f .next/lock ] && ! pgrep -f "next build" >/dev/null 2>&1; then
              rm -f .next/lock
              echo "Removed stale .next/lock"
            fi

            # ---- MEMORY GUARD (AUD-1, 2026-11-07): the 1GB box OOM-killed two
            #      builds today (runs 42391733996 & 42395920493) while the app
            #      kept its RSS during `next build`. Stop pm2 for the build
            #      window to free RAM; service is restored right after, whatever
            #      the outcome (old .next keeps serving if the build fails).
            pm2 stop tamkinly-prod >/dev/null 2>&1 || true
            BUILD_RC=0
            NODE_OPTIONS="--max-old-space-size=1280" npm run build > /root/tamkinly-autodeploy-build.log 2>&1 || BUILD_RC=$?

            # ---- BUILD GATE (npm exit code alone is NOT proof; Next 16 stale lock
            #      can fake BUILD_EXIT=0 — must verify log contents) ----
            # Next 16 (Turbopack) prints: "✓ Generating static pages using N workers (156/156)"
            # — the ✓-prefixed line only appears on completion
            if [ "$BUILD_RC" -eq 0 ] \
               && grep -q "✓ Generating static pages" /root/tamkinly-autodeploy-build.log \
               && test -s .next/BUILD_ID \
               && ! grep -q "Another next build" /root/tamkinly-autodeploy-build.log; then
              # Copy static files
              mkdir -p .next/standalone/.next
              cp -r .next/static .next/standalone/.next/
              cp -r public .next/standalone/

              # Restart PM2 — correct process name (tamkinly-prod, NOT tamkinly)
              pm2 restart tamkinly-prod

              # Save PM2 state
              pm2 save

              echo "Deployment completed successfully!"
            else
              echo "BUILD FAILED rc=$BUILD_RC — restoring previous build" >&2
              tail -40 /root/tamkinly-autodeploy-build.log >&2 || true
              pm2 restart tamkinly-prod 2>/dev/null || pm2 start npm --name tamkinly-prod -- start
              exit 1
            fi
