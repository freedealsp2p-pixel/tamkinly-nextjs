name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}

            # Pull latest changes
            git pull origin master

            # Install dependencies
            npm install

            # Generate Prisma client
            npx prisma generate

            # ---- DATABASE SAFETY FIX (2026-09-06) ----
            # 'prisma db push --accept-data-loss' REMOVED: it could silently destroy
            # production data. Without the flag:
            #   * additive schema changes -> applied automatically
            #   * destructive changes     -> Prisma refuses in non-interactive mode and
            #                                the deploy FAILS LOUDLY instead of data loss
            npx prisma db push --skip-generate

            # Remove stale Next build lock (only when no build is actually running)
            if [ -f .next/lock ] && ! pgrep -f "next build" >/dev/null 2>&1; then
              rm -f .next/lock
              echo "Removed stale .next/lock"
            fi

            # Build with sufficient memory (1280MB proven required on this 1GB box)
            NODE_OPTIONS="--max-old-space-size=1280" npm run build > /root/tamkinly-autodeploy-build.log 2>&1

            # ---- BUILD GATE (npm exit code alone is NOT proof; Next 16 stale lock
            #      can fake BUILD_EXIT=0 — must verify log contents) ----
            # Next 16 (Turbopack) prints: "✓ Generating static pages using N workers (156/156)"
            # — the ✓-prefixed line only appears on completion
            grep -q "✓ Generating static pages" /root/tamkinly-autodeploy-build.log
            test -s .next/BUILD_ID
            if grep -q "Another next build" /root/tamkinly-autodeploy-build.log; then
              echo "BUILD REFUSED: another build is already running" >&2
              exit 1
            fi

            # Copy static files
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/
            cp -r public .next/standalone/

            # Restart PM2 — correct process name (tamkinly-prod, NOT tamkinly)
            pm2 restart tamkinly-prod

            # Save PM2 state
            pm2 save

            echo "Deployment completed successfully!"
