name: Ops Read-Only Snapshot (AUD-1)

# AUD-1 (Super Z) — read-only operational snapshot for founder reports.
# Safety: no writes to the DB (SQLite mode=ro), no code changes, no restarts.
# Produces: support queue, expiring access, email-language audit, queue health.
# Artifact = private to this repo. Triggered manually only (workflow_dispatch).

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only DB snapshot over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          cat > /tmp/remote_snapshot.sh << 'EOS'
          set -e
          cd /var/www/tamkinly
          command -v sqlite3 >/dev/null 2>&1 || { apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq sqlite3 >/dev/null 2>&1; }
          DB="file:db/custom.db?mode=ro"
          Q() { sqlite3 -readonly "$DB" "$1"; }
          QH() { sqlite3 -readonly -header -separator '|' "$DB" "$1"; }
          echo "===RUN_AT==="; date -u +%FT%TZ
          echo "===USERS_LOCALE_DIST==="
          QH "SELECT COALESCE(locale,'__NULL__') AS loc, COUNT(*) AS n FROM users GROUP BY loc;"
          echo "===EXPIRING_7D==="
          QH "SELECT email,customerName,tier,expiresAt,productName FROM app_access WHERE isActive=1 AND expiresAt IS NOT NULL AND expiresAt <= datetime('now','+7 days') ORDER BY expiresAt ASC LIMIT 50;"
          echo "===EXPIRING_COUNT==="
          Q "SELECT COUNT(*) FROM app_access WHERE isActive=1 AND expiresAt IS NOT NULL AND expiresAt <= datetime('now','+7 days');"
          echo "===UNREAD_CONTACT==="
          QH "SELECT id,name,email,subject,replace(replace(substr(message,1,300),char(10),' '),char(13),' '),isReplied,createdAt FROM contact_messages WHERE isRead=0 ORDER BY createdAt DESC LIMIT 50;"
          echo "===UNREAD_CONTACT_COUNT==="
          Q "SELECT COUNT(*) FROM contact_messages WHERE isRead=0;"
          echo "===OPEN_TICKETS==="
          QH "SELECT ticketNumber,email,name,subject,category,priority,status,createdAt,updatedAt FROM support_tickets WHERE status NOT IN ('RESOLVED','CLOSED') ORDER BY createdAt DESC LIMIT 50;"
          echo "===OPEN_TICKETS_COUNT==="
          QH "SELECT status, COUNT(*) AS n FROM support_tickets GROUP BY status;"
          echo "===QUEUE_LAST100==="
          QH "SELECT email,subject,templateName,status,COALESCE(sentAt,createdAt) FROM email_queue ORDER BY createdAt DESC LIMIT 100;"
          echo "===QUEUE_STATUS_DIST==="
          QH "SELECT status, COUNT(*) AS n FROM email_queue GROUP BY status;"
          echo "===QUEUE_FAIL_LAST10==="
          QH "SELECT email,subject,status,error FROM email_queue WHERE status='FAILED' ORDER BY createdAt DESC LIMIT 10;"
          echo "===SNAPSHOT_END==="
          EOS
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/remote_snapshot.sh > ops_snapshot.txt
          rm -f ~/.ssh/vps_key
          wc -l ops_snapshot.txt

      - name: Brevo AR/EN template pair dump (read-only, AUD-1 copy review)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          cat > /tmp/remote_dump.sh << 'EOS'
          set -e
          cd /var/www/tamkinly
          KEY=$(grep -E '^BREVO_API_KEY=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
          [ -n "$KEY" ] || { echo "NO_BREVO_KEY"; exit 0; }
          cat > /tmp/brevo_pairs.py << 'PYEOF'
          import json, os, re, html, urllib.request
          KEY = os.environ.get('BREVO_KEY', '')
          BASE = 'https://api.brevo.com/v3/smtp/templates'
          def get(url):
              req = urllib.request.Request(url)
              req.add_header('api-key', KEY)
              req.add_header('accept', 'application/json')
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())
          def strip_html(h):
              h = re.sub(r'<style[\s\S]*?</style>', '', h or '')
              h = re.sub(r'<[^>]+>', ' ', h)
              return html.unescape(re.sub(r'\s+', ' ', h)).strip()
          print('===BREVO_TEMPLATE_LIST===')
          try:
              lst = get(BASE + '?limit=100&offset=0')
              for t in lst.get('templates', []):
                  print(t.get('id'), '|', (t.get('name') or '')[:60], '|', (t.get('subject') or '')[:90])
          except Exception as e:
              print('(list failed)', e)
          pairs = [
              ('WELCOME', 34, 57), ('QUIZ_RESULTS', 35, 58), ('CODE_BASIC', 36, 59),
              ('RECOVERY_TRC_01', 80, 138), ('PROTO_TD', 103, 161), ('PROTO_DAY_1', 106, 164),
              ('APP_HABIT_TRACKER', 120, 178), ('NUDGE_1', 135, 193),
          ]
          for key, ar_id, en_id in pairs:
              for lang, tid in (('AR', ar_id), ('EN', en_id)):
                  print('===PAIR_%s_%s_ID%d===' % (key, lang, tid))
                  try:
                      d = get(BASE + '/' + str(tid))
                      print('NAME:', d.get('name', ''))
                      print('SUBJECT:', d.get('subject', ''))
                      print('BODY:', strip_html(d.get('htmlContent') or '')[:900])
                  except Exception as e:
                      print('(fetch failed)', e)
          print('===BREVO_DUMP_END===')
          PYEOF
          BREVO_KEY="$KEY" python3 /tmp/brevo_pairs.py > brevo_dump.txt 2>&1 || echo "(dump script failed)"
          rm -f /tmp/brevo_pairs.py
          cat brevo_dump.txt
          EOS
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/remote_dump.sh > brevo_dump.txt
          rm -f ~/.ssh/vps_key
          echo "--- brevo_dump.txt (first 250 lines) ---"
          head -250 brevo_dump.txt

      - name: Brevo full template inventory + raw HTML for 106/164/196-199 (read-only, AUD-1)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          cat > /tmp/remote_inv.sh << 'EOS'
          set -e
          cd /var/www/tamkinly
          KEY=$(grep -E '^BREVO_API_KEY=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
          [ -n "$KEY" ] || { echo "NO_BREVO_KEY"; exit 0; }
          cat > /tmp/brevo_inv.py << 'PYEOF'
          import json, os, urllib.request
          KEY = os.environ.get('BREVO_KEY', '')
          BASE = 'https://api.brevo.com/v3/smtp/templates'
          def get(url):
              req = urllib.request.Request(url)
              req.add_header('api-key', KEY)
              req.add_header('accept', 'application/json')
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())
          # 1) full inventory, all pages
          print('===BREVO_FULL_INVENTORY===')
          all_templates = []
          for page in range(4):
              lst = get(BASE + f'?limit=100&offset={page*100}')
              batch = lst.get('templates', [])
              all_templates.extend(batch)
              if len(batch) < 100:
                  break
          for t in sorted(all_templates, key=lambda x: x.get('id') or 0):
              print(t.get('id'), '|', (t.get('name') or '')[:70], '|', (t.get('subject') or '')[:90], '|', 'active' if t.get('isActive') else 'inactive')
          print('TOTAL:', len(all_templates))
          # 2) raw HTML backups (106 + EN pair 164 + defaults 196-199)
          for tid in (106, 164, 196, 197, 198, 199):
              print(f'===RAW_TEMPLATE_{tid}===')
              try:
                  d = get(BASE + '/' + str(tid))
                  print('NAME:', d.get('name', ''))
                  print('SUBJECT:', d.get('subject', ''))
                  print('HTML_START')
                  print(d.get('htmlContent') or '(empty)')
                  print('HTML_END')
              except Exception as e:
                  print('(fetch failed)', e)
          print('===INV_END===')
          PYEOF
          BREVO_KEY="$KEY" python3 /tmp/brevo_inv.py > brevo_inventory.txt 2>&1 || echo "(inventory script failed)"
          rm -f /tmp/brevo_inv.py
          echo "remote lines: $(wc -l < brevo_inventory.txt)"
          cat brevo_inventory.txt
          EOS
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/remote_inv.sh > brevo_inventory.txt
          rm -f ~/.ssh/vps_key
          echo "--- inventory summary (full raw HTML kept in artifact) ---"
          grep -E '^(===|TOTAL|[0-9]+ \|)' brevo_inventory.txt | head -80

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-ro-snapshot-${{ github.run_id }}
          path: |
            ops_snapshot.txt
            brevo_dump.txt
            brevo_inventory.txt
          retention-days: 7
