name: Ops Read-Only Snapshot (AUD-1)

# AUD-1 (Super Z) — read-only operational snapshot for founder reports.
# Safety: no writes to the DB (SQLite mode=ro), no code changes, no restarts.
# Produces: support queue, expiring access, email-language audit, queue health.
# Artifact = private to this repo. Triggered manually only (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      brevo_action:
        description: 'scan = read-only audit | fix = repair corrupt AR word + delete unused French defaults 196-199 (founder-authorized 2026-10-18)'
        required: false
        default: 'scan'
        type: choice
        options:
          - scan
          - fix

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only DB snapshot over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          cat > /tmp/remote_snapshot.sh << 'EOS'
          set -e
          cd /var/www/tamkinly
          command -v sqlite3 >/dev/null 2>&1 || { apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq sqlite3 >/dev/null 2>&1; }
          DB="file:db/custom.db?mode=ro"
          Q() { sqlite3 -readonly "$DB" "$1"; }
          QH() { sqlite3 -readonly -header -separator '|' "$DB" "$1"; }
          echo "===RUN_AT==="; date -u +%FT%TZ
          echo "===USERS_LOCALE_DIST==="
          QH "SELECT COALESCE(locale,'__NULL__') AS loc, COUNT(*) AS n FROM users GROUP BY loc;"
          echo "===EXPIRING_7D==="
          QH "SELECT email,customerName,tier,expiresAt,productName FROM app_access WHERE isActive=1 AND expiresAt IS NOT NULL AND expiresAt <= datetime('now','+7 days') ORDER BY expiresAt ASC LIMIT 50;"
          echo "===EXPIRING_COUNT==="
          Q "SELECT COUNT(*) FROM app_access WHERE isActive=1 AND expiresAt IS NOT NULL AND expiresAt <= datetime('now','+7 days');"
          echo "===UNREAD_CONTACT==="
          QH "SELECT id,name,email,subject,replace(replace(substr(message,1,300),char(10),' '),char(13),' '),isReplied,createdAt FROM contact_messages WHERE isRead=0 ORDER BY createdAt DESC LIMIT 50;"
          echo "===UNREAD_CONTACT_COUNT==="
          Q "SELECT COUNT(*) FROM contact_messages WHERE isRead=0;"
          echo "===OPEN_TICKETS==="
          QH "SELECT ticketNumber,email,name,subject,category,priority,status,createdAt,updatedAt FROM support_tickets WHERE status NOT IN ('RESOLVED','CLOSED') ORDER BY createdAt DESC LIMIT 50;"
          echo "===OPEN_TICKETS_COUNT==="
          QH "SELECT status, COUNT(*) AS n FROM support_tickets GROUP BY status;"
          echo "===QUEUE_LAST100==="
          QH "SELECT email,subject,templateName,status,COALESCE(sentAt,createdAt) FROM email_queue ORDER BY createdAt DESC LIMIT 100;"
          echo "===QUEUE_STATUS_DIST==="
          QH "SELECT status, COUNT(*) AS n FROM email_queue GROUP BY status;"
          echo "===QUEUE_FAIL_LAST10==="
          QH "SELECT email,subject,status,error FROM email_queue WHERE status='FAILED' ORDER BY createdAt DESC LIMIT 10;"
          echo "===SNAPSHOT_END==="
          EOS
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/remote_snapshot.sh > ops_snapshot.txt
          rm -f ~/.ssh/vps_key
          wc -l ops_snapshot.txt

      - name: Brevo AR/EN template pair dump (read-only, AUD-1 copy review)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          cat > /tmp/remote_dump.sh << 'EOS'
          set -e
          cd /var/www/tamkinly
          KEY=$(grep -E '^BREVO_API_KEY=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
          [ -n "$KEY" ] || { echo "NO_BREVO_KEY"; exit 0; }
          cat > /tmp/brevo_pairs.py << 'PYEOF'
          import json, os, re, html, urllib.request
          KEY = os.environ.get('BREVO_KEY', '')
          BASE = 'https://api.brevo.com/v3/smtp/templates'
          def get(url):
              req = urllib.request.Request(url)
              req.add_header('api-key', KEY)
              req.add_header('accept', 'application/json')
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())
          def strip_html(h):
              h = re.sub(r'<style[\s\S]*?</style>', '', h or '')
              h = re.sub(r'<[^>]+>', ' ', h)
              return html.unescape(re.sub(r'\s+', ' ', h)).strip()
          print('===BREVO_TEMPLATE_LIST===')
          try:
              lst = get(BASE + '?limit=100&offset=0')
              for t in lst.get('templates', []):
                  print(t.get('id'), '|', (t.get('name') or '')[:60], '|', (t.get('subject') or '')[:90])
          except Exception as e:
              print('(list failed)', e)
          pairs = [
              ('WELCOME', 34, 57), ('QUIZ_RESULTS', 35, 58), ('CODE_BASIC', 36, 59),
              ('RECOVERY_TRC_01', 80, 138), ('PROTO_TD', 103, 161), ('PROTO_DAY_1', 106, 164),
              ('APP_HABIT_TRACKER', 120, 178), ('NUDGE_1', 135, 193),
          ]
          for key, ar_id, en_id in pairs:
              for lang, tid in (('AR', ar_id), ('EN', en_id)):
                  print('===PAIR_%s_%s_ID%d===' % (key, lang, tid))
                  try:
                      d = get(BASE + '/' + str(tid))
                      print('NAME:', d.get('name', ''))
                      print('SUBJECT:', d.get('subject', ''))
                      print('BODY:', strip_html(d.get('htmlContent') or '')[:900])
                  except Exception as e:
                      print('(fetch failed)', e)
          print('===BREVO_DUMP_END===')
          PYEOF
          BREVO_KEY="$KEY" python3 /tmp/brevo_pairs.py > brevo_dump.txt 2>&1 || echo "(dump script failed)"
          rm -f /tmp/brevo_pairs.py
          cat brevo_dump.txt
          EOS
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/remote_dump.sh > brevo_dump.txt
          rm -f ~/.ssh/vps_key
          echo "--- brevo_dump.txt (first 250 lines) ---"
          head -250 brevo_dump.txt

      - name: Brevo full template inventory + raw HTML for 106/164/196-199 (read-only, AUD-1)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          cat > /tmp/remote_inv.sh << 'EOS'
          set -e
          cd /var/www/tamkinly
          KEY=$(grep -E '^BREVO_API_KEY=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
          [ -n "$KEY" ] || { echo "NO_BREVO_KEY"; exit 0; }
          cat > /tmp/brevo_inv.py << 'PYEOF'
          import json, os, urllib.request
          KEY = os.environ.get('BREVO_KEY', '')
          BASE = 'https://api.brevo.com/v3/smtp/templates'
          def get(url):
              req = urllib.request.Request(url)
              req.add_header('api-key', KEY)
              req.add_header('accept', 'application/json')
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())
          # 1) full inventory, all pages
          print('===BREVO_FULL_INVENTORY===')
          all_templates = []
          for page in range(4):
              lst = get(BASE + f'?limit=100&offset={page*100}')
              batch = lst.get('templates', [])
              all_templates.extend(batch)
              if len(batch) < 100:
                  break
          for t in sorted(all_templates, key=lambda x: x.get('id') or 0):
              print(t.get('id'), '|', (t.get('name') or '')[:70], '|', (t.get('subject') or '')[:90], '|', 'active' if t.get('isActive') else 'inactive')
          print('TOTAL:', len(all_templates))
          # 2) raw HTML backups (106 + EN pair 164 + defaults 196-199)
          for tid in (106, 164, 196, 197, 198, 199):
              print(f'===RAW_TEMPLATE_{tid}===')
              try:
                  d = get(BASE + '/' + str(tid))
                  print('NAME:', d.get('name', ''))
                  print('SUBJECT:', d.get('subject', ''))
                  print('HTML_START')
                  print(d.get('htmlContent') or '(empty)')
                  print('HTML_END')
              except Exception as e:
                  print('(fetch failed)', e)
          print('===INV_END===')
          PYEOF
          BREVO_KEY="$KEY" python3 /tmp/brevo_inv.py > brevo_inventory.txt 2>&1 || echo "(inventory script failed)"
          rm -f /tmp/brevo_inv.py
          echo "remote lines: $(wc -l < brevo_inventory.txt)"
          cat brevo_inventory.txt
          EOS
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/remote_inv.sh > brevo_inventory.txt
          rm -f ~/.ssh/vps_key
          echo "--- inventory summary (full raw HTML kept in artifact) ---"
          grep -E '^(===|TOTAL|[0-9]+ \|)' brevo_inventory.txt | head -80

      - name: Brevo repair — stray-diacritic AR fix + unused defaults cleanup (founder-authorized 2026-10-18, gated)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          BREVO_ACTION: ${{ github.event.inputs.brevo_action || 'scan' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          cat > /tmp/remote_repair.sh << 'EOS'
          set -e
          ACTION="${1:-scan}"
          cd /var/www/tamkinly
          KEY=$(grep -E '^BREVO_API_KEY=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
          [ -n "$KEY" ] || { echo "NO_BREVO_KEY"; exit 0; }
          cat > /tmp/brevo_repair.py << 'PYEOF'
          import json, os, sys, time, urllib.request, urllib.error
          KEY = os.environ.get('BREVO_KEY', '')
          ACTION = os.environ.get('BREVO_ACTION', 'scan')
          BASE = 'https://api.brevo.com/v3/smtp/templates'
          CORRUPT = '\u0633\u0646\u062a\u0627\u064f\u0631\u0627\u0641\u0642\u0643'   # سنتاُرافقك (corrupted)
          FIXED   = '\u0633\u0646\u064f\u0631\u0627\u0641\u0642\u0643'                     # سنُرافقك (correct)
          DEFAULTS = (196, 197, 198, 199)  # Brevo French system defaults, unused (verified no code refs)
          def call(url, method='GET', payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              for attempt in range(4):
                  req = urllib.request.Request(url, data=data, method=method)
                  req.add_header('api-key', KEY)
                  req.add_header('accept', 'application/json')
                  if data: req.add_header('content-type', 'application/json')
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = r.read().decode()
                          return json.loads(body) if body.strip() else {}
                  except urllib.error.HTTPError as e:
                      body = ''
                      try: body = e.read().decode('utf-8', 'replace')[:400]
                      except Exception: pass
                      if e.code == 429 and attempt < 3:
                          time.sleep(5 * (attempt + 1)); continue
                      if e.code == 404: return None
                      print(f'HTTP_{e.code} {method} {url} body={body}')
                      raise
                  except Exception:
                      if attempt < 3: time.sleep(3); continue
                      raise
              return None
          # 1) inventory
          tpl = []
          for page in range(4):
              lst = call(BASE + f'?limit=100&offset={page*100}') or {}
              batch = lst.get('templates', [])
              tpl.extend(batch)
              if len(batch) < 100: break
          print('INVENTORY_TOTAL:', len(tpl))
          # 2) full scan of every template for the corrupt word
          affected = []
          for t in tpl:
              tid = t.get('id')
              d = call(BASE + '/' + str(tid))
              if not d: continue
              html = d.get('htmlContent') or ''
              n = html.count(CORRUPT)
              if n:
                  affected.append((tid, d.get('name',''), n, d))
                  print(f'MATCH id={tid} name={d.get("name","")!r} occurrences={n}')
              time.sleep(0.12)
          print('SCAN_AFFECTED_TOTAL:', len(affected))
          if ACTION != 'fix':
              print('SCAN_ONLY — no writes performed')
              sys.exit(0)
          # 3) fix (backup-first: print full before-HTML, then PUT minimal correction)
          for tid, name, n, d in affected:
              print(f'===BACKUP_{tid}===')
              print('NAME:', d.get('name','')); print('SUBJECT:', d.get('subject',''))
              print(d.get('htmlContent') or '')
              print(f'===BACKUP_END_{tid}===')
              fixed = d['htmlContent'].replace(CORRUPT, FIXED)
              payload = {'templateName': d.get('name',''), 'subject': d.get('subject',''),
                         'isActive': bool(d.get('isActive', True)), 'htmlContent': fixed}
              r = call(BASE + '/' + str(tid), method='PUT', payload=payload)
              v = call(BASE + '/' + str(tid)) or {}
              vh = v.get('htmlContent') or ''
              ok = (CORRUPT not in vh) and (FIXED in vh)
              print(f'FIXED id={tid} verified={ok} name_preserved={v.get("name","")==d.get("name","")} subject_preserved={v.get("subject","")==d.get("subject","")}')
              time.sleep(0.3)
          # 4) delete unused French defaults (safety: name must contain the French default marker)
          for tid in DEFAULTS:
              d = call(BASE + '/' + str(tid))
              if not d:
                  print(f'DEFAULT {tid}: already absent'); continue
              name = d.get('name','') or ''
              print(f'===BACKUP_{tid}==='); print('NAME:', name); print('SUBJECT:', d.get('subject',''))
              print(d.get('htmlContent') or ''); print(f'===BACKUP_END_{tid}===')
              if ('d\u00e9faut' not in name) and ('par d\u00e9faut' not in name):
                  print(f'ABORT delete id={tid}: name mismatch safety guard'); continue
              try:
                  # Brevo requires templates to be inactive before deletion (HTTP 405 otherwise);
                  # PUT on some defaults additionally requires a valid sender (HTTP 403 otherwise)
                  sender_obj = d.get('sender') or {}
                  if isinstance(sender_obj, dict) and sender_obj.get('id') is not None:
                      sender = {'id': sender_obj['id']}  # brevo: pass id OR email, never both
                  elif isinstance(sender_obj, dict) and sender_obj.get('email'):
                      sender = {'name': sender_obj.get('name', ''), 'email': sender_obj['email']}
                  else:
                      sender = {'name': 'Tamkinly Tech', 'email': 'noreply@tamkinly.com'}
                  call(BASE + '/' + str(tid), method='PUT', payload={
                      'templateName': d.get('name', ''), 'subject': d.get('subject', ''),
                      'isActive': False, 'htmlContent': d.get('htmlContent') or '',
                      'sender': sender})
                  call(BASE + '/' + str(tid), method='DELETE')
                  still = call(BASE + '/' + str(tid))
                  print(f'DELETED id={tid} verified_gone={still is None} name_was={name!r}')
              except Exception as e:
                  print(f'DELETE_FAILED id={tid} err={type(e).__name__}: {e}')
              time.sleep(0.3)
          # 5) final inventory + 106 verification
          tpl2 = []
          for page in range(4):
              lst = call(BASE + f'?limit=100&offset={page*100}') or {}
              batch = lst.get('templates', [])
              tpl2.extend(batch)
              if len(batch) < 100: break
          print('FINAL_TOTAL:', len(tpl2))
          print('FINAL_HAS_196_199:', any(t.get('id') in DEFAULTS for t in tpl2))
          d106 = call(BASE + '/106') or {}
          vh = d106.get('htmlContent') or ''
          print(f'VERIFY_106: corrupt_absent={CORRUPT not in vh} fixed_present={FIXED in vh} name={d106.get("name","")!r} subject={d106.get("subject","")!r}')
          print('REPAIR_DONE')
          PYEOF
          BREVO_KEY="$KEY" BREVO_ACTION="$ACTION" python3 /tmp/brevo_repair.py 2>&1
          rm -f /tmp/brevo_repair.py
          EOS
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' "$BREVO_ACTION" < /tmp/remote_repair.sh > brevo_repair.txt 2>&1 || BREVO_EXIT=$?
          rm -f ~/.ssh/vps_key
          echo "--- repair report (backups in artifact) ---"
          grep -E '^(INVENTORY_TOTAL|MATCH|SCAN_AFFECTED_TOTAL|SCAN_ONLY|===BACKUP_[0-9]+===$|FIXED|DEFAULT|DELETED|ABORT|FINAL_|REPAIR_DONE)' brevo_repair.txt | head -60 || true
          echo "--- repair output tail (always visible, even on failure) ---"
          tail -40 brevo_repair.txt || true
          exit ${BREVO_EXIT:-0}

      - name: VPS diagnostics (read-only, AUD-1)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            echo "===DF==="; df -h / 2>/dev/null | head -3
            echo "===MEM==="; free -m | head -3
            echo "===LOAD==="; uptime
            echo "===OOM_EVIDENCE==="; dmesg -T 2>/dev/null | grep -iE "out of memory|oom|killed process" | tail -6 || journalctl -k --since "2 hours ago" 2>/dev/null | grep -iE "out of memory|oom|killed process" | tail -6 || echo "(no oom evidence readable)"
            echo "===PM2==="; pm2 jlist 2>/dev/null | python3 -c "import json,sys;[print(p[\"name\"],p[\"pm2_env\"][\"status\"],\"restarts:\",p[\"pm2_env\"][\"restart_time\"],\"mem:\",round(p[\"monit\"][\"memory\"]/1048576),\"MB\") for p in json.load(sys.stdin)]" 2>/dev/null || pm2 list 2>/dev/null | head -8
            echo "===BUILD_LOG_TAIL==="; tail -25 /root/tamkinly-autodeploy-build.log 2>/dev/null || sudo tail -25 /root/tamkinly-autodeploy-build.log 2>/dev/null || echo "(build log not readable for this user)"
            echo "===DIAG_END==="
          ' > vps_diagnostics.txt 2>&1
          rm -f ~/.ssh/vps_key
          cat vps_diagnostics.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-ro-snapshot-${{ github.run_id }}
          path: |
            ops_snapshot.txt
            brevo_dump.txt
            brevo_inventory.txt
            brevo_repair.txt
            vps_diagnostics.txt
          retention-days: 7
