name: Deploy Tree Recovery (AUD-1, 2026-10-21) — v2 reset-to-origin

# v2: deploys 183-187 still conflicted. Root cause: the VPS HEAD holds LOCAL COMMITTED
# changes (merge commit 8d86679 incl. a diverged src/components/layout/Footer.tsx) that
# conflict with origin/master on every pull. Stash-guard cannot fix committed divergence.
# Resolution: record local-only commits + diffstat in the run log, keep a backup branch
# on the VPS (nothing is lost), stash the two known dirty files, then hard-reset the
# tree to origin/master (source of truth per founder directives). Deploy is dispatched
# separately afterwards.

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Backup local commits, reset tree to origin/master
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          cat > /tmp/recover.sh << 'EOS'
          set -e
          cd /var/www/tamkinly
          git merge --abort 2>/dev/null || git reset --merge 2>/dev/null || echo "(index already clean)"
          git fetch origin
          echo "===LOCAL_ONLY_COMMITS (origin/master..HEAD)==="
          git log --oneline origin/master..HEAD | head -20 || true
          echo "===LOCAL_DIFF_STAT vs origin==="
          git diff --stat origin/master...HEAD | tail -25 || true
          BR="backup/vps-local-$(date -u +%Y%m%dT%H%M%SZ)"
          git branch -f "$BR" HEAD && echo "backup branch created: $BR"
          git -c user.email=autodeploy@tamkinly.local -c user.name=tamkinly-autodeploy \
            stash push -m "recovery guard $(date -u +%FT%TZ)" \
            -- src/app/methodology/self-authorship/page.tsx src/components/layout/Footer.tsx || true
          git reset --hard origin/master
          echo "===AFTER==="
          git status --short | head -10 || true
          git log --oneline -3
          echo "===RECOVER_END==="
          EOS
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/recover.sh
          rm -f ~/.ssh/vps_key
