name: P3 Brevo V2 Templates (AUD-1, 2026-10-22)

# Founder command 2026-10-22: "نفذ التعليمات بتحديث قوالب الايميلات على brevo" (= execute P3).
# P3 scope (agreed 2026-10-18, worklog): rewrite 18 live templates advertising old
# $7/$17 monthly tiers to the two-package V2 model (The Planner $9.99 one-time /
# Mastery $27 one-time) + pause (not delete) TK-07 renewal + TK-18/19 upsell automations.
# Safety: Brevo API calls run ON the VPS (key never leaves server, never in logs);
# per-template guards (old-strings present -> residual clean -> tag balance -> params
# intact) — any failed guard = NO PUT, reported DIRTY; before/after HTML backed up to
# /tmp/brevo_p3 (artifact) + /var/www/tamkinly/db/backups/brevo-p3-<ts> (apply only).
# $17 never appears in new copy (V2 rule: only as struck anchor — not needed in email).

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'scan = read-only inventory + flagged backup | apply = rewrite 18 + pause automations'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - apply

jobs:
  p3:
    runs-on: ubuntu-latest
    steps:
      - name: P3 over SSH (Brevo API on VPS)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SCRIPT_B64: 
          RULES_B64: 
          TARGETS_B64: 
          PAUSED_B64: 
          ACTION: ${{ github.event.inputs.action }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          cat > /tmp/p3_env.sh << EOS
          export SCRIPT_B64='$SCRIPT_B64'
          export RULES_B64='$RULES_B64'
          export TARGETS_B64='$TARGETS_B64'
          export PAUSED_B64='$PAUSED_B64'
          export P3_ACTION='$ACTION'
          EOS
          cat > /tmp/p3_remote.sh << 'REMOTE EOS'
          set -e
          . /tmp/p3_env.sh
          cd /var/www/tamkinly
          KEY=$(grep -E '^BREVO_API_KEY=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
          if [ -z "$KEY" ]; then echo NO_BREVO_KEY; exit 0; fi
          echo "$SCRIPT_B64" | base64 -d > /tmp/p3_main.py
          BREVO_KEY="$KEY" P3_RULES_B64="$RULES_B64" P3_TARGETS_B64="$TARGETS_B64" P3_PAUSED_B64="$PAUSED_B64" \
            python3 /tmp/p3_main.py "$P3_ACTION"
          RC=$?
          if [ "$P3_ACTION" = "apply" ]; then
            mkdir -p /var/www/tamkinly/db/backups
            cp -r /tmp/brevo_p3 "/var/www/tamkinly/db/backups/brevo-p3-$(date -u +%Y%m%dT%H%M%SZ)" 2>/dev/null || true
          fi
          rm -f /tmp/p3_main.py /tmp/p3_env.sh
          exit 0
          REMOTE EOS
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P "$VPS_PORT" /tmp/p3_env.sh /tmp/p3_remote.sh "$VPS_USER@$VPS_HOST":/tmp/
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash /tmp/p3_remote.sh' | tee p3_result.txt
          mkdir -p brevo_p3_artifact
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -P "$VPS_PORT" -r "$VPS_USER@$VPS_HOST":/tmp/brevo_p3/. ./brevo_p3_artifact/ 2>/dev/null || true
          rm -f ~/.ssh/vps_key
          echo "=== P3 action: $ACTION done ==="

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-brevo-${{ github.run_id }}
          path: |
            p3_result.txt
            brevo_p3_artifact/
          retention-days: 14
